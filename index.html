<!DOCTYPE html>
<html>
<head>
    <title>MySong</title>
</head>
<body>

    <h1>MySong 🎵</h1>

    <input
        type="text"
        id="theme"
        placeholder="Enter a song theme">

    <button onclick="generateSong()">
        Generate Song
    </button>

    <pre id="output"></pre>

    <script>
    async function generateSong() {

        const theme =
            document.getElementById("theme").value;

        document.getElementById("output").textContent =
            "Generating song...";

        try {

            const response = await fetch(
                "/.netlify/functions/generate-song",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        theme: theme
                    })
                }
            );

            const data = await response.json();

            document.getElementById("output").textContent =
                data.song || data.error;

        } catch (error) {

            document.getElementById("output").textContent =
                "Error: " + error.message;

        }
    }
    </script>

</body>
</html>
